name: Validate
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Standard performance budgets
        run: npm run benchmark:check
      - name: Compact browser regression
        run: npm run test:e2e:compact
      - name: Summarize browser engine validation
        run: npm run report:browser-engines
      - name: Compact performance budgets
        run: npm run benchmark:check
      - name: Offline transport migrations and shared network pacing
        run: npm run validate:offline-transports
